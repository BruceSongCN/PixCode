name: pixcode-delivery
version: 1
description: 面向评审、多目标协作和测试交接的轻量 OpenSpec 交付流程

artifacts:
  - id: proposal
    generates: proposal.md
    description: 说明变更动机、边界、能力和影响范围
    template: proposal.md
    instruction: |
      说明为什么需要本次变更，以及本轮明确包含和不包含什么。
      Change 标识默认使用 `<module-id>-<feature-id>`；同一功能的后续并行变更使用 `<module-id>-<feature-id>-<change-topic>`，不添加无信息量的 establish/add/update 前缀。
      文档标题必须使用“<模块中文名>｜<功能中文名>｜变更提案”，并完整填写模块、功能、Change、Capability 和 Target 元数据。
      必须列出新增或修改的 capability，并标明受影响的 Target。
      保持简洁；实现方法留给后续设计资产。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 以可验证的需求与场景描述系统应当做什么
    template: spec.md
    instruction: |
      为 proposal 中的每个 capability 创建一份 delta spec。
      Capability 标识必须使用 `<module-id>-<feature-id>`，不得使用脱离模块上下文的功能名。
      文档标题必须使用“<模块中文名>｜<功能中文名>｜需求规格”，元数据必须与 proposal 一致。
      严格使用 OpenSpec 的 ADDED、MODIFIED、REMOVED、RENAMED 结构。
      每项 Requirement 必须使用 SHALL 或 MUST，并至少包含一个 WHEN/THEN Scenario。
      修改既有 Requirement 时必须复制并更新完整 Requirement 块。
    requires:
      - proposal

  - id: model
    generates: design/model.md
    description: 定义领域概念、数据结构、关系、状态和约束
    template: model.md
    instruction: |
      只记录本次变更涉及的模型增量及其对现有模型的影响。
      文档标题和顶部元数据必须与 proposal 中的模块、功能、Change、Capability 和 Target 一致。
      覆盖实体、值对象、字段、关系、状态、不变量和持久化影响。
      若确实不涉及模型变化，保留模板并明确写出“不适用”及判断依据。
    requires:
      - specs

  - id: process
    generates: design/process.md
    description: 定义业务流程、状态迁移、异常和跨目标协作
    template: process.md
    instruction: |
      描述主流程、分支、失败路径、补偿方式和参与者。
      文档标题和顶部元数据必须与 proposal 中的模块、功能、Change、Capability 和 Target 一致。
      标出每一步所属 Target 及跨 Target 边界。
      若不涉及流程变化，保留模板并明确写出“不适用”及判断依据。
    requires:
      - specs

  - id: contracts
    generates: design/contracts.md
    description: 定义 API、事件、消息和跨目标共享契约
    template: contracts.md
    instruction: |
      记录本轮新增或变化的运行时契约、消费者、兼容策略和错误语义。
      文档标题和顶部元数据必须与 proposal 一致；Target 元数据应区分提供方和消费者。
      不复制可由 OpenAPI 或代码可靠生成的完整内容，只保留评审所需的稳定契约。
      若不涉及契约变化，保留模板并明确写出“不适用”及判断依据。
    requires:
      - specs

  - id: test-plan
    generates: test/test-plan.md
    description: 从需求场景推导分目标与跨目标测试方案
    template: test-plan.md
    instruction: |
      将每个关键 Scenario 映射到测试层级、Target、环境、数据和证据。
      文档标题和顶部元数据必须与 proposal 中的模块、功能、Change、Capability 和 Target 一致。
      区分单目标验证、契约测试、集成测试和端到端测试。
      只声明资源角色和数据特征，不写入真实账号、密码或 Token。
    requires:
      - model
      - process
      - contracts

  - id: tasks
    generates: tasks.md
    description: 按 Target 与依赖关系拆分可验证的实现任务
    template: tasks.md
    instruction: |
      使用 `- [ ] X.Y` 格式编写任务，确保 OpenSpec 可以跟踪进度。
      文档标题和顶部元数据必须与 proposal 中的模块、功能、Change、Capability 和 Target 一致。
      按共享契约、各 Target 实现、自动化测试和联调收口分组。
      每项任务都应有明确完成条件，并能关联 Requirement 或 Scenario。
    requires:
      - specs
      - model
      - process
      - contracts
      - test-plan

  - id: verification
    generates: verification.md
    description: 实现完成后的验证结果、证据索引和遗留风险
    template: verification.md
    instruction: |
      仅依据真实执行结果填写，不得把计划或推断写成已通过。
      文档标题和顶部元数据必须与 proposal 中的模块、功能、Change、Capability 和 Target 一致。
      按 Target 汇总命令、环境、结果和证据位置，并给出最终结论。
      未执行或失败的项目必须显式列出原因、影响和后续动作。
    requires:
      - tasks
      - test-plan

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    按 tasks.md 的依赖顺序实现并及时勾选。
    开始每个 Target 前读取其仓库规则；保持共享契约与 specs 一致。
    遇到需求或契约缺口时暂停，不用实现猜测替代设计决定。
